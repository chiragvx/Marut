<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Marut</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../favicon.ico" sizes="48x48" />
    <link rel="icon" href="../icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <!-- Link previews (public/og-marut.jpg). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marut" />
    <meta property="og:title" content="Marut: combat flight over India, in your browser" />
    <meta property="og:description" content="A free combat flight simulator that runs in your browser. Fly the Tejas Mk1A over Punjab from Bhisiana AFS, Bathinda. No download, no sign-up." />
    <meta property="og:url" content="https://marut-nu.vercel.app/play/" />
    <meta property="og:image" content="https://marut-nu.vercel.app/og-marut.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MARUT in amber over a Tejas climbing nose-up against a dusk sky" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marut: combat flight over India, in your browser" />
    <meta name="twitter:description" content="A free combat flight simulator that runs in your browser. Fly the Tejas Mk1A over Punjab from Bhisiana AFS, Bathinda. No download, no sign-up." />
    <meta name="twitter:image" content="https://marut-nu.vercel.app/og-marut.jpg" />
    <meta name="theme-color" content="#0a0e14" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0e14; overflow: hidden; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      #render-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #ui-root { position: absolute; inset: 0; overflow-y: auto; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="render-canvas"></canvas>
      <canvas id="hud-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
